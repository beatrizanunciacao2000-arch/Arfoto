<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      inset: 0;
    }

    #msg {
      position: fixed;
      bottom: 20px;
      left: 10px;
      right: 10px;
      z-index: 99999;
      color: #fff;
      background: rgba(0, 0, 0, .7);
      padding: 10px;
      border-radius: 10px;
      font-family: Arial;
    }

    #video {
      display: none;
    }
  </style>
</head>

<body>

  <div id="msg">
    Carregando câmera...
  </div>

  <div id="ar-container">

    <a-scene mindar-image="
imageTargetSrc: ./targets.mind;
uiLoading:no;
uiScanning:no;
uiError:no;
" color-space="sRGB" renderer="
colorManagement:true;
physicallyCorrectLights:false;
antialias:true;
alpha:true;
" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" loading-screen="enabled:false">

      <a-assets>

        <video id="video" src="./video.mp4" muted loop playsinline webkit-playsinline crossorigin="anonymous"
          preload="auto">
        </video>

      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled:false">
      </a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">

        <a-video id="videoPlane" src="#video" position="0 0 0.01">
        </a-video>

      </a-entity>

    </a-scene>

  </div>

  <script>

    const msg = document.querySelector("#msg");
    const video = document.querySelector("#video");
    const target = document.querySelector("#target");

    function avisar(t) {
      msg.innerText = t;
      console.log(t);
    }

    window.addEventListener("click", async () => {

      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
      } catch (e) { }

    }, { once: true });

    document
      .querySelector("a-scene")
      .addEventListener("renderstart", () => {

        avisar("Câmera iniciada.");

      });

    document
      .querySelector("a-scene")
      .addEventListener("arReady", () => {

        avisar("Aponte para a imagem.");

      });

    document
      .querySelector("a-scene")
      .addEventListener("arError", () => {

        avisar("Erro ao abrir câmera.");

      });

    target.addEventListener("targetFound", async () => {

      avisar("Imagem encontrada.");

      try {

        video.currentTime = 0;
        await video.play();

      } catch (e) {

        avisar("Toque na tela.");

      }

    });

    target.addEventListener("targetLost", () => {

      avisar("Imagem perdida.");
      video.pause();

    });



  </script>

  <script>

    const video = document.querySelector("#video");
    const videoPlane = document.querySelector("#videoPlane");

    video.addEventListener("loadedmetadata", () => {

      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      const ratio = videoHeight / videoWidth;

      videoPlane.setAttribute("width", 1);
      videoPlane.setAttribute("height", ratio);

      console.log("Proporção ajustada:", ratio);

    });

  </script>

  <script>

    const img = new Image();

    img.src = "./target.png"; // A MESMA imagem usada no targets.mind

    img.onload = () => {

      const plane = document.querySelector("#videoPlane");

      const ratio = img.height / img.width;

      plane.setAttribute("width", 1);
      plane.setAttribute("height", ratio);

      console.log("Imagem alvo carregada");
      console.log("Proporção:", ratio);

    };

  </script>

</body>

</html>
