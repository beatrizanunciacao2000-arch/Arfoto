<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AR Vídeo</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    canvas,
    video {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    Carregando câmera...
  </div>

  <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded
    style="width: 100vw; height: 100vh;">

    <a-assets>

      <video id="video" src="video.mp4" preload="auto" autoplay muted loop playsinline webkit-playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video src="#video" width="1" height="0.56" position="0 0 0">
      </a-video>

    </a-entity>

  </a-scene>

  <script>

    window.addEventListener("DOMContentLoaded", () => {

      const video = document.querySelector("#video");

      const startVideo = async () => {
        try {
          await video.play();
        } catch (e) {
          console.log("Vídeo aguardando interação");
        }
      };

      startVideo();

      const scene = document.querySelector("a-scene");

      scene.addEventListener("loaded", () => {
        document.getElementById("loading").style.display = "none";
      });

    });

  </script>

</body>

</html>
